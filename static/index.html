<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
 <link rel="stylesheet" href="./static/styles.css">
</head>

<body>
  <aside id="side">
    <div class="brand"><b>Maya-1</b><button class="btn" id="new">New chat</button></div>
    <div id="list"></div>
    <div class="dir" id="dir"></div>
  </aside>
  <main>
    <header>
      <button class="btn" id="menu">Chats</button>
      <h1 id="title">New chat</h1>
      <code id="model"></code>
    </header>
    <div id="feed">
      <div id="wrap"></div>
    </div>
    <form id="form">
      <div class="box">
        <textarea id="in" rows="1" placeholder="Message Maya"></textarea>
        <button type="button" class="mic" id="mic" aria-label="Dictate" title="Dictate">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
</button>
        <button class="send" id="send">Send</button>
      </div>
    </form>
  </main>

 <script src="./static/main.js"></script>
</body>

</html>
